<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phonics Fun for Kids</title>
<style>
body{margin:0;font-family:"Trebuchet MS",system-ui;background:linear-gradient(#bce8ff 0 210px,#e5f6d9 210px);color:#26334a}header{text-align:center;padding:20px}h1{font-size:clamp(2rem,6vw,3rem);margin:10px}main{max-width:900px;margin:auto;padding:12px}.panel{background:#fffdf4;border:3px solid white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 5px #c3dfa9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}button{font:inherit;font-weight:bold;border:0;border-radius:15px;padding:13px;background:#ff8fa3;color:white;box-shadow:0 4px #d96c83;cursor:pointer}button.blue{background:#7bc8e8;box-shadow:0 4px #4797bb;color:#17384a}button.green{background:#7fc77c;box-shadow:0 4px #559e53;color:#173d25}.choice{background:white;color:#26334a;box-shadow:0 4px #bdd29e;border:3px solid #d9e8b7;font-size:1.2rem;min-height:85px}.pic{font-size:2rem;display:block}.hidden{display:none}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.prompt{text-align:center;background:#fff0b8;padding:15px;border-radius:14px;font-size:1.2rem}.status{text-align:center;min-height:28px;font-weight:bold}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.badge{background:#fff0ad;border-radius:30px;padding:8px 12px}footer{text-align:center;padding:18px;font-size:.9rem}
</style></head><body><header><div style="font-size:48px">🏰🌼</div><strong>TOXY'S SOUND GARDEN</strong><h1>Let's play with sounds!</h1><p>Phonics Fun for Kids · Listen, look, choose and build</p></header><main>
<section class="panel"><h2>🌼 Choose a sound set</h2><div id="sets" class="grid"></div><p id="selected">Selected Set 1: S A T P</p></section>
<section class="panel"><h2>🎮 Choose a game</h2><div class="grid"><button onclick="start('sound')">🌷 Sound Garden</button><button class="blue" onclick="start('picture')">🖼️ Picture Match</button><button class="green" onclick="start('listen')">👂 Listen & Choose</button><button onclick="start('build')">🧩 Word Builder</button></div></section>
<section id="game" class="panel hidden"><div class="row"><span class="badge" id="gameName"></span><span class="badge">⭐ <span id="score">0</span></span></div><p id="prompt" class="prompt"></p><div id="choices" class="choices"></div><p id="status" class="status" aria-live="polite"></p><div class="row"><button class="blue" onclick="speakCurrent()">🔊 Hear again</button><button class="green" onclick="nextRound()">Next ➜</button><button onclick="home()">Games menu</button></div></section></main><footer>© Ana Garrido Herrada · Phonics Fun for Kids</footer>
<script>
const sets=[["S","A","T","P"],["I","N","M","D"],["G","O","C","K"],["CK","E","U","R"],["H","B","F","FF","LL","SS"],["J","V","W","X"],["Y","Z","ZZ","QU"],["CH","SH","TH","NG"],["AI","EE","IGH","OA","OO"],["AR","OR","UR","OW","OI"],["AIR","URE","EAR","ER"]];
const names=["Set 1","Set 2","Set 3","Set 4","Set 5","Set 6","Set 7","Set 8","Set 9","Set 10","Set 11"];
const words=[["SUN","S","☀️"],["APPLE","A","🍎"],["TIGER","T","🐯"],["PIG","P","🐷"],["INK","I","🖋️"],["NEST","N","🪺"],["MOON","M","🌙"],["DOG","D","🐶"],["GOAT","G","🐐"],["ORANGE","O","🍊"],["CAT","C","🐱"],["KITE","K","🪁"],["EGG","E","🥚"],["UP","U","⬆️"],["RABBIT","R","🐰"],["HAT","H","🎩"],["BUS","B","🚌"],["FISH","F","🐟"],["JAM","J","🍓"],["VAN","V","🚐"],["WET","W","💧"],["BOX","X","📦"],["YAK","Y","🐂"],["ZEBRA","Z","🦓"],["CHIP","CH","🍟"],["SHIP","SH","🚢"],["THUMB","TH","👍"],["RING","NG","💍"],["RAIN","AI","🌧️"],["BEE","EE","🐝"],["NIGHT","IGH","🌙"],["BOAT","OA","⛵"]];
let setIndex=0,mode="sound",target=null,score=0,answered=false;
const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
$("sets").innerHTML=sets.map((s,i)=>`<button class="${i%2?'blue':'green'}" onclick="chooseSet(${i})">${names[i]}<br><small>${s.join(" · ")}</small></button>`).join("");
function chooseSet(i){setIndex=i;$("selected").textContent="Selected "+names[i]+": "+sets[i].join(" · ")}
function pool(){let p=words.filter(w=>sets[setIndex].includes(w[1]));return p.length?p:words.filter(w=>["S","A","T","P"].includes(w[1]))}
function say(t){if(!window.speechSynthesis){$("status").textContent="Audio unavailable in this browser. Say the word together!";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang="en-GB";u.rate=.8;speechSynthesis.speak(u)}
function start(m){mode=m;score=0;$("score").textContent=0;$("game").classList.remove("hidden");$("gameName").textContent=({sound:"🌷 Sound Garden",picture:"🖼️ Picture Match",listen:"👂 Listen & Choose",build:"🧩 Word Builder"})[m];nextRound();$("game").scrollIntoView({behavior:"smooth"})}
function speakCurrent(){if(target)say(mode==="sound"?target[1]:target[0])}
function nextRound(){answered=false;$("status").textContent="";let p=pool();target=p[Math.floor(Math.random()*p.length)];let opts=[];
if(mode==="sound"){opts=shuffle([target[1],...shuffle(sets[setIndex].filter(x=>x!==target[1])).slice(0,3)]).map(x=>({v:x,h:x}));$("prompt").textContent="Find this sound: "+target[1]}
else{opts=shuffle([target,...shuffle(p.filter(x=>x!==target)).slice(0,3)]).map(x=>({v:x[0],h:`<span class="pic">${x[2]}</span>${x[0]}`}));$("prompt").textContent=mode==="picture"?"Find the picture that starts with "+target[1]:mode==="listen"?"Listen and choose the word":"Find the word that starts with "+target[1]}
$("choices").innerHTML=opts.map(o=>`<button class="choice" onclick="answer('${o.v}')">${o.h}</button>`).join("");if(mode==="listen")setTimeout(()=>say(target[0]),250)}
function answer(v){if(answered)return;answered=true;let ok=v===(mode==="sound"?target[1]:target[0]);if(ok){score++;$("score").textContent=score;$("status").textContent="⭐ Brilliant! That's right!";say(mode==="sound"?target[1]:target[0])}else{$("status").textContent="Good try! The answer is "+(mode==="sound"?target[1]:target[0])+". Try the next one!";say(mode==="sound"?target[1]:target[0])}}
function home(){$("game").classList.add("hidden")}
</script></body></html>
